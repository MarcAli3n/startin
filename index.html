<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --accent: #00e676;
            --danger: #ff5252;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }

        /* Cursor pointer por defecto para la interacción habitual */
        .item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
            padding-bottom: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .item:hover {
            background: #282828;
            transform: translateY(-2px);
        }

        /* El cursor de agarre SOLO se activa al arrastrar realmente */
        .sortable-drag {
            cursor: grabbing !important;
        }

        .sortable-ghost {
            opacity: 0.3;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: #2a2a2a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            overflow: hidden;
        }

        .icon-wrapper img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .item-tools {
            position: absolute;
            top: 6px;
            right: 6px;
            display: opacity;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .item:hover .item-tools {
            opacity: 1;
        }

        .tool-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .tool-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .action-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #333;
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 100;
        }

        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            display: none;
            z-index: 101;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .link-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .link-row input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            flex: 1;
        }

        select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div style="width: 100%; max-width: 1000px; display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button class="action-btn" onclick="openAddModal()">+ Añadir Acceso Directo</button>
    </div>

    <div id="grid" class="grid"></div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <!-- Modal de Edición / Creación -->
    <div id="siteModal" class="modal">
        <h3 id="modalTitle" style="margin-top: 0; color: var(--accent);">Configurar Icono</h3>
        
        <div style="margin-bottom:15px">
            <label style="font-size:0.8rem; opacity:0.6; display:block; margin-bottom:5px">Nombre Principal</label>
            <input type="text" id="siteNameInput" style="width:100%; background:#222; border:1px solid #444; color:white; padding:10px; border-radius:8px; box-sizing:border-box">
        </div>

        <div id="linksContainer">
            <label style="font-size:0.8rem; opacity:0.6; display:block; margin-bottom:10px">Enlaces (el primero genera el icono)</label>
        </div>

        <button class="action-btn" style="width:100%; margin: 15px 0; font-size: 0.75rem; justify-content: center;" onclick="addLinkRow()">+ Añadir otro enlace</button>
        
        <div style="display: flex; gap: 8px; margin-top: 20px;">
            <button class="action-btn" style="flex: 1; background: var(--accent); color: black; justify-content: center;" onclick="saveSite()">Guardar</button>
            <button id="deleteSiteBtn" class="action-btn" style="background: var(--danger); border-color: var(--danger); justify-content: center; display: none;" onclick="deleteFromModal()">Eliminar</button>
            <button class="action-btn" style="flex: 1; justify-content: center;" onclick="closeAllModals()">Cancelar</button>
        </div>
    </div>

    <script>
        const STORAGE_SITES = 'my_dashboard_sites';
        let currentEditIndex = null;

        let mySites = JSON.parse(localStorage.getItem(STORAGE_SITES)) || [
            {
                name: "Google",
                links: [{ label: "Buscador", url: "https://www.google.com" }]
            },
            {
                name: "YouTube",
                links: [{ label: "Inicio", url: "https://www.youtube.com" }]
            }
        ];

        const grid = document.getElementById('grid');

        function saveToStorage() {
            localStorage.setItem(STORAGE_SITES, JSON.stringify(mySites));
        }

        function render() {
            grid.innerHTML = '';
            mySites.forEach((site, i) => {
                const item = document.createElement('div');
                item.className = 'item';

                const primaryUrl = site.links[0]?.url || '#';
                let domain = '';
                try {
                    domain = new URL(primaryUrl).hostname;
                } catch (e) {
                    domain = '';
                }

                const fallbackLetter = site.name.charAt(0).toUpperCase();

                let dropdownHtml = '';
                if (site.links.length > 1) {
                    dropdownHtml = `<select onchange="if(this.value) window.location.href=this.value" onclick="event.stopPropagation()">
                        <option value="" disabled selected>Opciones...</option>
                        ${site.links.map(link => `<option value="${link.url}">${link.label}</option>`).join('')}
                    </select>`;
                }

                item.innerHTML = `
                    <div class="item-tools">
                        <button class="tool-btn btn-edit" onclick="event.stopPropagation(); openEditModal(${i})">✎</button>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center; width:100%;" onclick="if(${site.links.length} === 1) window.location.href='${primaryUrl}'">
                        <div class="icon-wrapper">
                            <img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}" loading="lazy" decoding="async" onerror="this.remove(); this.parentElement.innerText='${fallbackLetter}';">
                        </div>
                        <span>${site.name}</span>
                    </div>
                    ${dropdownHtml}`;

                grid.appendChild(item);
            });
        }

        function addLinkRow(label = '', url = '') {
            const container = document.getElementById('linksContainer');
            const row = document.createElement('div');
            row.className = 'link-row';
            row.innerHTML = `
                <input type="text" placeholder="Etiqueta" value="${label}" class="link-label">
                <input type="url" placeholder="https://..." value="${url}" class="link-url">
                <button class="action-btn" style="padding: 0 10px;" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        function openAddModal() {
            currentEditIndex = null;
            document.getElementById('siteNameInput').value = "";
            document.getElementById('linksContainer').innerHTML = '';
            document.getElementById('deleteSiteBtn').style.display = 'none';
            addLinkRow();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('siteModal').style.display = 'block';
        }

        function openEditModal(i) {
            currentEditIndex = i;
            const site = mySites[i];
            document.getElementById('siteNameInput').value = site.name;
            document.getElementById('linksContainer').innerHTML = '';
            document.getElementById('deleteSiteBtn').style.display = 'flex';
            site.links.forEach(link => addLinkRow(link.label, link.url));
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('siteModal').style.display = 'block';
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('siteModal').style.display = 'none';
        }

        function saveSite() {
            const name = document.getElementById('siteNameInput').value.trim();
            const labels = document.querySelectorAll('.link-label');
            const urls = document.querySelectorAll('.link-url');
            
            const links = [];
            labels.forEach((labelInput, idx) => {
                const url = urls[idx].value.trim();
                const label = labelInput.value.trim() || 'Enlace';
                if (url) links.push({ label, url });
            });

            if (!name || links.length === 0) {
                alert('Añade un nombre y al menos un enlace válido.');
                return;
            }

            const siteData = { name, links };

            if (currentEditIndex !== null) {
                mySites[currentEditIndex] = siteData;
            } else {
                mySites.push(siteData);
            }

            saveToStorage();
            closeAllModals();
            render();
        }

        function deleteFromModal() {
            if (currentEditIndex !== null && confirm("¿Seguro que quieres eliminar este acceso directo?")) {
                mySites.splice(currentEditIndex, 1);
                saveToStorage();
                closeAllModals();
                render();
            }
        }

        // Inicialización de SortableJS con reordenación drag & drop
        new Sortable(grid, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            onEnd: function () {
                const newSites = [];
                const items = grid.querySelectorAll('.item');
                items.forEach(item => {
                    const name = item.querySelector('span').innerText;
                    const found = mySites.find(s => s.name === name);
                    if (found) newSites.push(found);
                });
                mySites = newSites;
                saveToStorage();
            }
        });

        // Carga inicial
        render();
    </script>
</body>
</html>
